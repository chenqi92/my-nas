name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
  # 自动创建的 release tag 不再次触发构建，避免同一 build number
  # 被两条并发工作流重复提交到 App Store Connect。
  # 补发或重试请使用手动触发。
  workflow_dispatch:
    inputs:
      force_release:
        description: '强制发布（忽略版本检查）'
        required: false
        type: boolean
        default: false

jobs:
  # 检查是否需要发布
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      version_code: ${{ steps.check.outputs.version_code }}
      full_version: ${{ steps.check.outputs.full_version }}
      is_tag: ${{ steps.check.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          # 解析 pubspec.yaml 版本号 X.Y.Z+N
          # X.Y.Z 用于 tag 与发布展示；N 是 build number（versionCode/CFBundleVersion），
          # 仅用于商店递增，不参与 tag 名（避免 1.0.1+6 也能发正式版 v1.0.1）
          FULL_VERSION_RAW=$(grep "^version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
          CURRENT_VERSION=$(echo "$FULL_VERSION_RAW" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$FULL_VERSION_RAW" | cut -d'+' -f2)

          if [ "$VERSION_CODE" == "$CURRENT_VERSION" ]; then
            VERSION_CODE="1"
          fi

          # tag 与展示版本始终用 X.Y.Z（含 -alpha/-beta/-rc 等 semver 预发布后缀）
          FULL_VERSION="$CURRENT_VERSION"

          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION, Build: $VERSION_CODE, Tag: v$FULL_VERSION"

          # 检查是否是 tag 触发
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Triggered by tag: ${{ github.ref_name }}"
            exit 0
          fi

          echo "is_tag=false" >> $GITHUB_OUTPUT

          # 检查是否是手动触发且强制发布
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ inputs.force_release }}" == "true" ]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "Force release triggered manually"
              exit 0
            fi
            # 手动触发但不强制，检查 tag 是否存在
            if git ls-remote --tags origin | grep -q "refs/tags/v${FULL_VERSION}$"; then
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "Tag v$FULL_VERSION already exists, skipping release"
            else
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "Manual trigger: will create release for $FULL_VERSION"
            fi
            exit 0
          fi

          # 检查 pubspec.yaml 是否在本次提交中被修改
          if ! git diff HEAD~1 HEAD --name-only | grep -q "^pubspec.yaml$"; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "pubspec.yaml not changed, skipping release"
            exit 0
          fi

          # 检查版本是否改变（包括 build number）
          if git diff HEAD~1 HEAD -- pubspec.yaml | grep -q "^+version:"; then
            # 检查该版本的 tag 是否已存在
            if git ls-remote --tags origin | grep -q "refs/tags/v${FULL_VERSION}$"; then
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "Tag v$FULL_VERSION already exists, skipping release"
            else
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "Version changed to $FULL_VERSION, will create release"
            fi
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Version not changed in pubspec.yaml, skipping release"
          fi

  # 创建 Tag
  create-tag:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true' && needs.check-release.outputs.is_tag == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        id: create_tag
        run: |
          TAG_NAME="v${{ needs.check-release.outputs.full_version }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 幂等：tag 已存在视为成功（用于补发构建失败的平台，复用同一 release）
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            echo "Tag $TAG_NAME already exists on remote, skip creating"
            exit 0
          fi

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Created tag: $TAG_NAME"

  # 提取版本信息（用于后续构建）
  # 注意：故意只依赖 check-release，不依赖 create-tag。
  # 之前依赖 create-tag 时，tag 触发场景下 create-tag 被跳过，extract-version
  # 必须用 if: always() 才能跑；这会让 GH Actions 把"链路含 skipped"传播到所有
  # 下游 build job，导致它们被无声跳过（即使 build job 自己写了显式 if 也救不回来）。
  # extract-version 本身只是算个 tag_name 字符串，不需要等 create-tag 完成。
  extract-version:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.check-release.outputs.version }}
      version_code: ${{ needs.check-release.outputs.version_code }}
      full_version: ${{ needs.check-release.outputs.full_version }}
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
    steps:
      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ needs.check-release.outputs.is_tag }}" == "true" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v${{ needs.check-release.outputs.full_version }}" >> $GITHUB_OUTPUT
          fi

  # 构建 Android APK（多架构）
  build-android:
    needs: extract-version
    # 显式 if: 必需 —— extract-version 用了 if: always()，下游不写 if 会被 GH Actions
    # 当作"链路含 skipped"自动跳过。
    if: needs.extract-version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      distribution_signed: ${{ steps.signing.outputs.signing }}
    env:
      # 限制 Gradle daemon 内存使用
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g"
    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          # 删除不需要的预装软件以释放空间
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26*
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=== After cleanup ==="
          df -h

      - uses: actions/checkout@v4

      # 发布构建必须配置正式签名，确保产物可持续升级和正常分发：
      # - ANDROID_KEYSTORE_BASE64: base64-encoded release keystore
      # - ANDROID_KEY_PROPERTIES_BASE64: base64-encoded key.properties
      - name: Restore Android release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEY_PROPERTIES_BASE64:-}" ]; then
            echo "::warning::Android release signing secrets are unavailable; building a development-signed CI artifact"
            echo "ALLOW_DEBUG_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "signing=development" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/release-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" \
            | base64 --decode > android/key.properties

          if [ ! -s android/app/release-keystore.jks ]; then
            echo "::error::Decoded Android release keystore is empty"
            exit 1
          fi
          if [ ! -s android/key.properties ]; then
            echo "::error::Decoded android/key.properties is empty"
            exit 1
          fi

          for key in storeFile storePassword keyAlias keyPassword; do
            if ! grep -Eq "^[[:space:]]*${key}[[:space:]]*[=:][[:space:]]*[^[:space:]].*$" android/key.properties; then
              echo "::error::android/key.properties is missing a non-empty ${key}"
              exit 1
            fi
          done

          # The encoded properties may come from a developer machine. Pin the
          # path to the keystore restored in this runner instead of trusting a
          # local or absolute storeFile path.
          sed -i -E \
            's|^[[:space:]]*storeFile[[:space:]]*[=:].*$|storeFile=release-keystore.jks|' \
            android/key.properties
          chmod 600 android/app/release-keystore.jks android/key.properties
          echo "signing=available" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 预下载 Gradle，避免构建时网络问题
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Pre-download Gradle (with retry)
        run: |
          cd android
          for i in {1..3}; do
            ./gradlew --version --no-daemon && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      # 清理缓存避免 "Already watching path" 问题
      - name: Clean Flutter build cache
        run: |
          flutter clean
          rm -rf ~/.pub-cache/hosted/pub.dev/*/
          rm -rf build/
          rm -rf .dart_tool/

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 构建分架构 APK (使用 --no-daemon 避免文件监控冲突)
      - name: Build APK (split per ABI)
        run: |
          cd android && ./gradlew --stop || true
          cd ..
          flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk MyNAS-${{ needs.extract-version.outputs.version }}-android-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk MyNAS-${{ needs.extract-version.outputs.version }}-android-armeabi-v7a.apk
          mv app-x86_64-release.apk MyNAS-${{ needs.extract-version.outputs.version }}-android-x86_64.apk

      # 也构建一个通用 APK（包含所有架构）
      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename universal APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk MyNAS-${{ needs.extract-version.outputs.version }}-android-universal.apk

      - name: Verify Android 16 KB page-size compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/MyNAS-${{ needs.extract-version.outputs.version }}-android-universal.apk"
          # GitHub's Ubuntu image installs the SDK here but does not always
          # export ANDROID_HOME/ANDROID_SDK_ROOT into later shell steps.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ZIPALIGN=$(find "$SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -1)
          READELF=$(find "$SDK_ROOT/ndk" -type f -name llvm-readelf -print | sort -V | tail -1)

          if [ -z "$ZIPALIGN" ] || [ -z "$READELF" ]; then
            echo "::error::zipalign or llvm-readelf is unavailable"
            exit 1
          fi

          "$ZIPALIGN" -c -P 16 4 "$APK"
          VERIFY_DIR="$RUNNER_TEMP/android-16kb-verify"
          rm -rf "$VERIFY_DIR"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d "$VERIFY_DIR"

          while IFS= read -r library; do
            if "$READELF" -lW "$library" \
                | awk '$1 == "LOAD" && $NF == "0x1000" { found = 1 } END { exit !found }'; then
              echo "::error::4 KB LOAD alignment: ${library#"$VERIFY_DIR"/}"
              exit 1
            fi
          done < <(
            find "$VERIFY_DIR/lib/arm64-v8a" "$VERIFY_DIR/lib/x86_64" \
              -type f -name '*.so' -print
          )

          echo "All 64-bit Android native libraries support 16 KB pages"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/MyNAS-*.apk
          retention-days: 3

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f android/app/release-keystore.jks android/key.properties

  # 构建 iOS IPA
  build-ios:
    needs: extract-version
    if: needs.extract-version.result == 'success'
    # 必须用 macos-15+，否则 device_info_plus 12.4 用到的 isiOSAppOnVision (iOS 17.2 SDK) 找不到
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      app_store_uploaded: ${{ steps.upload_ios.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4

      # 显式选择最新稳定版 Xcode（macos-15 默认 Xcode 可能不是最新，
      # 需要 Xcode 15.2+ 才有 iOS 17.2 SDK，里面才声明了 isiOSAppOnVision）
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install iOS distribution signing material
        id: ios_signing
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
          IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SIGNING_AVAILABLE=true
          for name in \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            IOS_APP_PROVISIONING_PROFILE_BASE64 \
            IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 \
            IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::iOS distribution secret is unavailable: $name"
              SIGNING_AVAILABLE=false
            fi
          done

          if [ "$SIGNING_AVAILABLE" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Building an unsigned iOS compile artifact; App Store upload is skipped"
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          PROFILES_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          API_KEYS_PATH="$HOME/.appstoreconnect/private_keys"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"

          mkdir -p "$PROFILES_PATH" "$API_KEYS_PATH"
          printf '%s' "$IOS_APP_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILES_PATH/mynas-app.mobileprovision"
          printf '%s' "$IOS_WIDGETS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILES_PATH/mynas-widgets.mobileprovision"
          printf '%s' "$IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILES_PATH/mynas-live-activity.mobileprovision"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode \
            > "$API_KEYS_PATH/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEYS_PATH/AuthKey_${APPLE_API_KEY_ID}.p8"

          echo "APPLE_CI_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$API_KEYS_PATH/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 清理并重新安装 CocoaPods 依赖
      - name: Clean and install pods
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update || true
          pod install --repo-update

      - name: Build signed App Store IPA
        if: steps.ios_signing.outputs.available == 'true'
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Build unsigned iOS compile artifact
        if: steps.ios_signing.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            MyNAS-${{ needs.extract-version.outputs.version }}-ios-unsigned.zip

      - name: Upload unsigned iOS artifact
        if: steps.ios_signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: MyNAS-*-ios-unsigned.zip
          retention-days: 3

      - name: Verify IPA signatures
        if: steps.ios_signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -type f -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Signed IPA was not generated"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa-verify"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-verify"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/ipa-verify/Payload/Runner.app"

      # App Store-signed IPAs are not directly installable from GitHub. Submit
      # the build to App Store Connect instead of publishing a misleading IPA.
      - name: Upload iOS build to App Store Connect
        id: upload_ios
        if: steps.ios_signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -type f -print -quit)
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Remove iOS signing material
        if: always()
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "${APPLE_CI_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_CI_KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/apple-distribution.p12"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/mynas-app.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/mynas-widgets.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/mynas-live-activity.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

  # 构建 macOS Universal Binary
  # 之前用过 matrix 同时构建 Intel(x86_64) 和 Apple Silicon(arm64)，但 GitHub
  # 免费 macos-13 (Intel) runner 容量极度紧张，runner_name 长时间为空、排队
  # 数十分钟到几小时拿不到机器是常态。改为只在 macos-15 (Apple Silicon) 上构建
  # 一个 universal binary —— Flutter 默认就会同时输出 x86_64 和 arm64 切片，
  # 一个 .app/.dmg 在 Intel 和 Apple Silicon Mac 上都能跑（这也是 Apple
  # 推荐的发布方式）。
  build-macos:
    needs: extract-version
    if: needs.extract-version.result == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      app_store_uploaded: ${{ steps.upload_macos.outputs.uploaded }}
      developer_id_signed: ${{ steps.macos_signing.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 显式选择最新稳定版 Xcode（确保用最新工具链编译）
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install macOS App Store and Developer ID signing material
        id: macos_signing
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          MACOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE_BASE64 }}
          MACOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SIGNING_AVAILABLE=true
          for name in \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 \
            MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            MACOS_APP_PROVISIONING_PROFILE_BASE64 \
            MACOS_WIDGET_PROVISIONING_PROFILE_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::macOS distribution secret is unavailable: $name"
              SIGNING_AVAILABLE=false
            fi
          done

          if [ "$SIGNING_AVAILABLE" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Building an unsigned macOS archive; App Store upload, Developer ID signing and notarization are skipped"
            exit 0
          fi

          DISTRIBUTION_CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          DEVELOPER_ID_CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          PROFILES_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" \
            | base64 --decode > "$DISTRIBUTION_CERTIFICATE_PATH"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" \
            | base64 --decode > "$DEVELOPER_ID_CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$DISTRIBUTION_CERTIFICATE_PATH" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$DEVELOPER_ID_CERTIFICATE_PATH" \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"

          mkdir -p "$PROFILES_PATH"
          printf '%s' "$MACOS_APP_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILES_PATH/mynas-macos-app.provisionprofile"
          printf '%s' "$MACOS_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILES_PATH/mynas-macos-widgets.provisionprofile"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$DISTRIBUTION_CERTIFICATE_PATH" "$DEVELOPER_ID_CERTIFICATE_PATH" "$API_KEY_PATH"

          echo "APPLE_CI_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      # 验证 checkout 完整性
      - name: Verify checkout
        run: |
          echo "=== Workspace contents ==="
          ls -la
          echo "=== macOS directory ==="
          ls -la macos/ || echo "ERROR: macos directory not found!"
          echo "=== macOS Runner.xcodeproj ==="
          ls -la macos/Runner.xcodeproj/ || echo "ERROR: Runner.xcodeproj not found!"
          echo "=== project.pbxproj ==="
          ls -la macos/Runner.xcodeproj/project.pbxproj || echo "ERROR: project.pbxproj not found!"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # 确保 macOS 平台配置正确
      - name: Setup macOS platform
        run: |
          # 显示当前状态
          echo "=== Before setup ==="
          ls -la macos/Runner.xcodeproj/ 2>/dev/null || echo "Runner.xcodeproj not found"

          # 强制重新创建 macOS 平台配置以确保完整性
          echo "Ensuring macOS platform is properly configured..."
          flutter create --platforms=macos --org com.kkape .

          echo "=== After setup ==="
          ls -la macos/Runner.xcodeproj/

          # 修改 macOS 部署目标为 11.0（file_picker 等插件需要）
          echo "Updating macOS deployment target to 11.0..."
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10\.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' macos/Runner.xcodeproj/project.pbxproj
          echo "Deployment target updated"

          # 预缓存 macOS 工具链
          flutter precache --macos

      # 清理可能损坏的 native assets 缓存
      - name: Clean native assets cache
        run: |
          rm -rf ~/.pub-cache/hosted/pub.dev/sqlite3-*/
          rm -rf .dart_tool/native_assets_builder/
          rm -rf build/

      - name: Get dependencies
        run: flutter pub get

      # 清理并重建 native assets (sqlite3)
      - name: Clean and rebuild native assets
        run: |
          flutter clean
          flutter pub get
          dart run build_runner clean || true

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 验证 Flutter 可以识别 macOS 项目
      - name: Verify Flutter recognizes macOS
        run: |
          echo "=== Flutter devices ==="
          flutter devices

          echo "=== Flutter config ==="
          flutter config

          echo "=== Check Flutter can build macOS ==="
          flutter build macos --help > /dev/null 2>&1 && echo "macOS build available" || echo "macOS build NOT available"

          echo "=== Flutter doctor ==="
          flutter doctor -v

      - name: Archive and upload macOS build to App Store Connect
        id: upload_macos
        if: steps.macos_signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/MyNAS-AppStore.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/MyNAS-AppStore-export"
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"

          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=2U97K3U27A

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist macos/ExportOptionsUpload.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Configure Developer ID signing
        if: steps.macos_signing.outputs.available == 'true'
        run: |
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "-";/CODE_SIGN_IDENTITY = "Developer ID Application";/g' \
            macos/Runner.xcodeproj/project.pbxproj
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Developer ID Application";/g' \
            macos/Runner.xcodeproj/project.pbxproj
          sed -i '' \
            's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Developer ID Application";/g' \
            macos/Runner.xcodeproj/project.pbxproj

      - name: Build signed macOS app
        if: steps.macos_signing.outputs.available == 'true'
        run: flutter build macos --release

      - name: Build unsigned macOS compile artifact
        if: steps.macos_signing.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --release --config-only
          xcodebuild build \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify macOS code signature
        if: steps.macos_signing.outputs.available == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/macos/Build/Products/Release/my_nas.app
          codesign --display --verbose=4 \
            build/macos/Build/Products/Release/my_nas.app

      # 验证产物为 universal binary（应同时包含 x86_64 和 arm64 切片）
      - name: Verify universal binary
        run: |
          BIN="build/macos/Build/Products/Release/my_nas.app/Contents/MacOS/my_nas"
          if [ -f "$BIN" ]; then
            echo "=== lipo -info ==="
            lipo -info "$BIN" || true
          fi

      - name: Create DMG
        if: steps.macos_signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG="MyNAS-${{ needs.extract-version.outputs.version }}-macos.dmg"
          brew install create-dmg
          create-dmg \
            --volname "MyNAS" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "my_nas.app" 150 185 \
            --hide-extension "my_nas.app" \
            --app-drop-link 450 185 \
            "$DMG" \
            "build/macos/Build/Products/Release/my_nas.app" || test -f "$DMG"

          codesign --force --timestamp --sign "Developer ID Application" "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"

      - name: Notarize and staple macOS DMG
        if: steps.macos_signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="MyNAS-${{ needs.extract-version.outputs.version }}-macos.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Create unsigned macOS archive
        if: steps.macos_signing.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/my_nas.app \
            MyNAS-${{ needs.extract-version.outputs.version }}-macos-unsigned.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          retention-days: 3
          path: |
            MyNAS-*.dmg
            MyNAS-*-macos-unsigned.zip

      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${APPLE_CI_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_CI_KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/apple-distribution.p12"
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/mynas-macos-app.provisionprofile"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/mynas-macos-widgets.provisionprofile"

  # 构建 Windows x64
  build-windows:
    needs: extract-version
    if: needs.extract-version.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      distribution_signed: ${{ steps.windows_signing.outputs.available }}
    env:
      # 兜底：让 cl.exe 对每个编译单元都注入静默宏，覆盖 CMake 定义可能漏到的 target。
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4

      - name: Restore Windows code-signing certificate
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64)) {
            Write-Warning "Windows signing certificate is unavailable; building unsigned CI artifacts"
            "WINDOWS_CERTIFICATE_SUBJECT=CN=MyNAS Development" | Out-File -FilePath $env:GITHUB_ENV -Append
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Warning "Windows signing certificate password is unavailable; building unsigned CI artifacts"
            "WINDOWS_CERTIFICATE_SUBJECT=CN=MyNAS Development" | Out-File -FilePath $env:GITHUB_ENV -Append
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64)
          )
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD
          )
          if (-not $certificate.HasPrivateKey) {
            throw "The Windows signing certificate does not contain a private key"
          }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) {
            throw "signtool.exe was not found"
          }

          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_SUBJECT=$($certificate.Subject)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_SIGNTOOL=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 检查是否有 Windows 支持
      - name: Check Windows support
        id: check_windows
        shell: bash
        run: |
          if [ -d "windows" ]; then
            echo "supported=true" >> $GITHUB_OUTPUT
          else
            echo "supported=false" >> $GITHUB_OUTPUT
            echo "::warning::Windows platform not configured in this project"
          fi

      - name: Enable Windows desktop
        if: steps.check_windows.outputs.supported == 'true'
        run: flutter config --enable-windows-desktop

      # 清理可能损坏的构建缓存
      - name: Clean build cache
        if: steps.check_windows.outputs.supported == 'true'
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path .dart_tool) { Remove-Item -Recurse -Force .dart_tool }

      - name: Get dependencies
        if: steps.check_windows.outputs.supported == 'true'
        run: flutter pub get

      - name: Generate code
        if: steps.check_windows.outputs.supported == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      # 重试构建（如果失败，清理后重试一次）
      - name: Build Windows x64 (with retry)
        if: steps.check_windows.outputs.supported == 'true'
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First build attempt failed, cleaning and retrying..."
            if (Test-Path build\windows) { Remove-Item -Recurse -Force build\windows }
            flutter clean
            if ($LASTEXITCODE -ne 0) { throw "Flutter clean failed before Windows retry" }
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw "Dependency restore failed before Windows retry" }
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { throw "Windows release build failed after retry" }
          }

      - name: Sign Windows application binaries
        if: steps.check_windows.outputs.supported == 'true' && steps.windows_signing.outputs.available == 'true'
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $binaries = Get-ChildItem "build\windows\x64\runner\Release" -Recurse -File -Include *.exe,*.dll
          if ($binaries.Count -eq 0) {
            throw "No Windows application binaries were found to sign"
          }
          foreach ($binary in $binaries) {
            & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($binary.FullName)" }
          }
          & $env:WINDOWS_SIGNTOOL verify /pa /v "build\windows\x64\runner\Release\my_nas.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows executable signature verification failed" }

      - name: Create ZIP (Portable)
        if: steps.check_windows.outputs.supported == 'true'
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MyNAS-${{ needs.extract-version.outputs.version }}-windows-x64-portable.zip

      # 创建 MSIX 安装包
      - name: Create MSIX installer
        if: steps.check_windows.outputs.supported == 'true'
        shell: pwsh
        run: |
          dart pub global activate msix
          dart pub global run msix:create --build-windows false --output-path . --output-name MyNAS-${{ needs.extract-version.outputs.version }}-windows-x64 --sign-msix false --publisher $env:WINDOWS_CERTIFICATE_SUBJECT
          if ($LASTEXITCODE -ne 0) { throw "MSIX creation failed" }

          $msix = "MyNAS-${{ needs.extract-version.outputs.version }}-windows-x64.msix"
          $manifestDirectory = Join-Path $env:RUNNER_TEMP "mynas-msix-manifest"
          if (Test-Path $manifestDirectory) { Remove-Item -Recurse -Force $manifestDirectory }
          [IO.Compression.ZipFile]::ExtractToDirectory($msix, $manifestDirectory)
          [xml]$manifest = Get-Content (Join-Path $manifestDirectory "AppxManifest.xml")
          $baseVersion = "${{ needs.extract-version.outputs.version }}".Split("-")[0]
          $expectedMsixVersion = "$baseVersion.0"
          $actualMsixVersion = $manifest.Package.Identity.Version
          if ($actualMsixVersion -ne $expectedMsixVersion) {
            throw "MSIX manifest version $actualMsixVersion does not match release version $expectedMsixVersion"
          }
          Remove-Item -Recurse -Force $manifestDirectory

          if ("${{ steps.windows_signing.outputs.available }}" -eq "true") {
            & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $msix
            if ($LASTEXITCODE -ne 0) { throw "MSIX signing failed" }
            & $env:WINDOWS_SIGNTOOL verify /pa /v $msix
            if ($LASTEXITCODE -ne 0) { throw "MSIX signature verification failed" }
          } else {
            Write-Warning "MSIX was created without Authenticode signing"
          }
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}

      # 创建 EXE 安装包 (使用 Inno Setup)
      - name: Install Inno Setup
        if: steps.check_windows.outputs.supported == 'true'
        run: choco install innosetup -y

      - name: Create Inno Setup script
        if: steps.check_windows.outputs.supported == 'true'
        shell: pwsh
        run: |
          $version = "${{ needs.extract-version.outputs.version }}"
          $script = @"
          [Setup]
          AppName=MyNAS
          AppVersion=$version
          AppPublisher=MyNAS
          DefaultDirName={autopf}\MyNAS
          DefaultGroupName=MyNAS
          OutputDir=.
          OutputBaseFilename=MyNAS-$version-windows-x64-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\MyNAS"; Filename: "{app}\my_nas.exe"
          Name: "{group}\Uninstall MyNAS"; Filename: "{uninstallexe}"
          Name: "{commondesktop}\MyNAS"; Filename: "{app}\my_nas.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\my_nas.exe"; Description: "Launch MyNAS"; Flags: nowait postinstall skipifsilent
          "@
          $script | Out-File -FilePath "installer.iss" -Encoding UTF8

      - name: Build EXE installer
        if: steps.check_windows.outputs.supported == 'true'
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }

          $installer = "MyNAS-${{ needs.extract-version.outputs.version }}-windows-x64-setup.exe"
          if ("${{ steps.windows_signing.outputs.available }}" -eq "true") {
            & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "Windows installer signing failed" }
            & $env:WINDOWS_SIGNTOOL verify /pa /v $installer
            if ($LASTEXITCODE -ne 0) { throw "Windows installer signature verification failed" }
          } else {
            Write-Warning "Inno Setup installer was created without Authenticode signing"
          }

      - name: Upload Windows artifact
        if: steps.check_windows.outputs.supported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          retention-days: 3
          path: |
            MyNAS-*-windows-*.zip
            MyNAS-*-windows-*.msix
            MyNAS-*-windows-*-setup.exe

      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -Force $env:WINDOWS_CERTIFICATE_PATH -ErrorAction SilentlyContinue
          }

  # 构建 Linux x64
  build-linux:
    needs: extract-version
    if: needs.extract-version.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libsecret-1-dev libnotify-dev libkeybinder-3.0-dev libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # 清理可能损坏的构建缓存
      - name: Clean build cache
        run: |
          rm -rf build/
          rm -rf .dart_tool/

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 重试构建（如果失败，清理后重试一次）
      - name: Build Linux (with retry)
        run: |
          if ! flutter build linux --release; then
            echo "First build attempt failed, cleaning and retrying..."
            rm -rf build/linux
            flutter clean
            flutter pub get
            flutter build linux --release
          fi

      - name: Create tarball
        run: |
          cd build/linux/x64/release
          tar -czvf ../../../../MyNAS-${{ needs.extract-version.outputs.version }}-linux-x64.tar.gz bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-x64
          path: MyNAS-*.tar.gz
          retention-days: 3

  # 构建 Linux arm64
  build-linux-arm64:
    needs: extract-version
    if: needs.extract-version.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libsecret-1-dev libnotify-dev libkeybinder-3.0-dev libayatana-appindicator3-dev curl git unzip xz-utils

      # 手动安装 Flutter (flutter-action 不支持 ARM64 Linux)
      - name: Install Flutter manually
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version
          flutter config --enable-linux-desktop
          flutter precache --linux

      # 清理可能损坏的构建缓存
      - name: Clean build cache
        run: |
          rm -rf build/
          rm -rf .dart_tool/

      - name: Get dependencies
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter pub get

      - name: Generate code
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          dart run build_runner build --delete-conflicting-outputs

      # 重试构建（如果失败，清理后重试一次）
      - name: Build Linux ARM64 (with retry)
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          if ! flutter build linux --release; then
            echo "First build attempt failed, cleaning and retrying..."
            rm -rf build/linux
            flutter clean
            flutter pub get
            flutter build linux --release
          fi

      - name: Create tarball
        run: |
          cd build/linux/arm64/release
          tar -czvf ../../../../MyNAS-${{ needs.extract-version.outputs.version }}-linux-arm64.tar.gz bundle

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-arm64
          path: MyNAS-*.tar.gz
          retention-days: 3

  # 生成更新日志
  generate-changelog:
    needs: extract-version
    if: always() && needs.extract-version.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      stats: ${{ steps.changelog.outputs.stats }}
      previous_tag: ${{ steps.changelog.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          FULL_VERSION="${{ needs.extract-version.outputs.full_version }}"

          # 获取上一个 tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

          # 获取提交范围
          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD~20..HEAD"
            COMPARE_INFO="首次发布"
          else
            RANGE="$PREVIOUS_TAG..HEAD"
            COMPARE_INFO="与 $PREVIOUS_TAG 相比"
          fi

          # 统计信息
          COMMIT_COUNT=$(git rev-list --count $RANGE 2>/dev/null || echo "0")

          if [ -n "$PREVIOUS_TAG" ]; then
            # 获取文件变更统计
            DIFF_STAT=$(git diff --shortstat $PREVIOUS_TAG HEAD 2>/dev/null || echo "")
            FILES_CHANGED=$(echo "$DIFF_STAT" | grep -oE '[0-9]+ file' | grep -oE '[0-9]+' || echo "0")
            INSERTIONS=$(echo "$DIFF_STAT" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
            DELETIONS=$(echo "$DIFF_STAT" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo "0")
          else
            FILES_CHANGED="N/A"
            INSERTIONS="N/A"
            DELETIONS="N/A"
          fi

          # 获取贡献者（通过单次 GitHub API 调用获取）
          echo "Fetching contributors..."
          CONTRIBUTORS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contributors?per_page=10" \
            | jq -r '.[].login' 2>/dev/null | head -5 | tr '\n' ', ' | sed 's/,$//' | sed 's/,/, /g')
          if [ -z "$CONTRIBUTORS" ]; then
            CONTRIBUTORS="${{ github.repository_owner }}"
          fi
          echo "Contributors: $CONTRIBUTORS"

          # 获取详细提交列表（使用 git log，不调用 API）
          echo "Generating commit list..."
          COMMITS_DETAILED=$(git log $RANGE --pretty=format:"- %s (\`%h\`)" --no-merges 2>/dev/null | head -30)
          echo "Commits found: $(echo "$COMMITS_DETAILED" | wc -l)"
          COMMITS_SIMPLE=$(git log $RANGE --pretty=format:"- %s" --no-merges 2>/dev/null || echo "")

          # 分类提交 - 新功能
          FEATURES=$(echo "$COMMITS_SIMPLE" | grep -iE "^- (feat|feature|新增|添加)" || true)
          FEATURES_DETAILED=$(echo "$COMMITS_DETAILED" | grep -iE "^- (feat|feature|新增|添加)" || true)

          # 分类提交 - Bug修复
          FIXES=$(echo "$COMMITS_SIMPLE" | grep -iE "^- (fix|修复|bugfix|bug)" || true)
          FIXES_DETAILED=$(echo "$COMMITS_DETAILED" | grep -iE "^- (fix|修复|bugfix|bug)" || true)

          # 分类提交 - 性能优化
          PERF=$(echo "$COMMITS_SIMPLE" | grep -iE "^- (perf|优化|性能|improve)" || true)
          PERF_DETAILED=$(echo "$COMMITS_DETAILED" | grep -iE "^- (perf|优化|性能|improve)" || true)

          # 分类提交 - 重构
          REFACTOR=$(echo "$COMMITS_SIMPLE" | grep -iE "^- (refactor|重构|restructure)" || true)
          REFACTOR_DETAILED=$(echo "$COMMITS_DETAILED" | grep -iE "^- (refactor|重构|restructure)" || true)

          # 分类提交 - 文档
          DOCS=$(echo "$COMMITS_SIMPLE" | grep -iE "^- (doc|docs|文档|readme)" || true)
          DOCS_DETAILED=$(echo "$COMMITS_DETAILED" | grep -iE "^- (doc|docs|文档|readme)" || true)

          # 分类提交 - 样式/UI
          STYLE=$(echo "$COMMITS_SIMPLE" | grep -iE "^- (style|ui|界面|样式|css)" || true)
          STYLE_DETAILED=$(echo "$COMMITS_DETAILED" | grep -iE "^- (style|ui|界面|样式|css)" || true)

          # 分类提交 - 构建/CI
          BUILD=$(echo "$COMMITS_SIMPLE" | grep -iE "^- (build|ci|chore|构建|依赖|deploy)" || true)
          BUILD_DETAILED=$(echo "$COMMITS_DETAILED" | grep -iE "^- (build|ci|chore|构建|依赖|deploy)" || true)

          # 其他提交
          OTHERS=$(echo "$COMMITS_SIMPLE" | grep -viE "^- (feat|feature|fix|修复|bugfix|bug|perf|优化|性能|improve|refactor|重构|doc|docs|文档|readme|style|ui|界面|样式|css|build|ci|chore|构建|依赖|deploy|新增|添加)" || true)
          OTHERS_DETAILED=$(echo "$COMMITS_DETAILED" | grep -viE "^- (feat|feature|fix|修复|bugfix|bug|perf|优化|性能|improve|refactor|重构|doc|docs|文档|readme|style|ui|界面|样式|css|build|ci|chore|构建|依赖|deploy|新增|添加)" || true)

          # 构建 changelog
          CHANGELOG=""

          # 统计概览
          CHANGELOG="${CHANGELOG}### 📊 版本概览\n\n"
          CHANGELOG="${CHANGELOG}| 指标 | 数值 |\n"
          CHANGELOG="${CHANGELOG}|------|------|\n"
          CHANGELOG="${CHANGELOG}| 提交数量 | ${COMMIT_COUNT} |\n"
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG="${CHANGELOG}| 文件变更 | ${FILES_CHANGED} |\n"
            CHANGELOG="${CHANGELOG}| 新增行数 | +${INSERTIONS} |\n"
            CHANGELOG="${CHANGELOG}| 删除行数 | -${DELETIONS} |\n"
          fi
          CHANGELOG="${CHANGELOG}| 贡献者 | ${CONTRIBUTORS} |\n\n"

          if [ -n "$FEATURES_DETAILED" ]; then
            FEATURE_COUNT=$(echo "$FEATURES" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### ✨ 新功能 (${FEATURE_COUNT})\n${FEATURES_DETAILED}\n\n"
          fi

          if [ -n "$FIXES_DETAILED" ]; then
            FIX_COUNT=$(echo "$FIXES" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### 🐛 Bug 修复 (${FIX_COUNT})\n${FIXES_DETAILED}\n\n"
          fi

          if [ -n "$PERF_DETAILED" ]; then
            PERF_COUNT=$(echo "$PERF" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### ⚡ 性能优化 (${PERF_COUNT})\n${PERF_DETAILED}\n\n"
          fi

          if [ -n "$REFACTOR_DETAILED" ]; then
            REFACTOR_COUNT=$(echo "$REFACTOR" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### ♻️ 代码重构 (${REFACTOR_COUNT})\n${REFACTOR_DETAILED}\n\n"
          fi

          if [ -n "$STYLE_DETAILED" ]; then
            STYLE_COUNT=$(echo "$STYLE" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### 🎨 界面优化 (${STYLE_COUNT})\n${STYLE_DETAILED}\n\n"
          fi

          if [ -n "$BUILD_DETAILED" ]; then
            BUILD_COUNT=$(echo "$BUILD" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### 🔧 构建/CI (${BUILD_COUNT})\n${BUILD_DETAILED}\n\n"
          fi

          if [ -n "$DOCS_DETAILED" ]; then
            DOCS_COUNT=$(echo "$DOCS" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### 📚 文档更新 (${DOCS_COUNT})\n${DOCS_DETAILED}\n\n"
          fi

          if [ -n "$OTHERS_DETAILED" ]; then
            OTHERS_COUNT=$(echo "$OTHERS" | grep -c "^-" || echo "0")
            CHANGELOG="${CHANGELOG}### 📝 其他更新 (${OTHERS_COUNT})\n${OTHERS_DETAILED}\n\n"
          fi

          # 如果没有任何分类，显示所有提交
          if [ -z "$FEATURES_DETAILED" ] && [ -z "$FIXES_DETAILED" ] && [ -z "$PERF_DETAILED" ] && [ -z "$REFACTOR_DETAILED" ] && [ -z "$STYLE_DETAILED" ] && [ -z "$BUILD_DETAILED" ] && [ -z "$DOCS_DETAILED" ] && [ -z "$OTHERS_DETAILED" ]; then
            CHANGELOG="${CHANGELOG}### 📝 更新内容\n${COMMITS_DETAILED}\n\n"
          fi

          # 添加版本对比链接
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG="${CHANGELOG}---\n\n"
            CHANGELOG="${CHANGELOG}📋 **完整变更**: [\`${PREVIOUS_TAG}...v${FULL_VERSION}\`](https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${FULL_VERSION})\n"
          fi

          # 调试输出
          echo "=== Generated Changelog ==="
          echo -e "$CHANGELOG"
          echo "=== End Changelog ==="

          # 输出到 GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 输出统计信息
          echo "stats=${COMMIT_COUNT} commits, ${FILES_CHANGED} files changed" >> $GITHUB_OUTPUT

          echo "Changelog generation completed"

  # 创建 Release
  create-release:
    needs: [extract-version, build-android, build-ios, build-macos, build-windows, build-linux, build-linux-arm64, generate-changelog]
    # 只要 extract-version 成功就尝试创建 release（不依赖具体某个 build 结果）。
    # 真正决定是否发布由后面的 "Check artifacts" 步骤判断 —— 只要有任意构建产物就发布，
    # 这样可以处理：
    # 1) build-macos 是 matrix，整体 result 为 'failure' 时其实可能还有 arm64 的产物
    # 2) 某些平台失败但其它平台成功
    if: always() && needs.extract-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 调试：显示接收到的 changelog
      - name: Debug changelog
        id: debug_changelog
        env:
          CHANGELOG_INPUT: ${{ needs.generate-changelog.outputs.changelog }}
        run: |
          echo "=== Changelog from generate-changelog job ==="
          if [ -z "$CHANGELOG_INPUT" ]; then
            echo "WARNING: Changelog is empty, using default"
            CHANGELOG_INPUT="### 📝 更新内容\n\n此版本包含多项更新和改进。"
          fi
          echo "$CHANGELOG_INPUT"
          echo "=== End ==="
          echo "Stats: ${{ needs.generate-changelog.outputs.stats }}"

          # 保存到 GITHUB_OUTPUT（使用 heredoc 避免特殊字符问题）
          {
            echo 'changelog<<CHANGELOG_EOF'
            echo "$CHANGELOG_INPUT"
            echo 'CHANGELOG_EOF'
          } >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts found"

      # 检查是否有任何构建产物 —— 没有就跳过发布（避免发布空 release）
      - name: Check artifacts
        id: check_artifacts
        run: |
          ARTIFACT_COUNT=$(find artifacts -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $ARTIFACT_COUNT artifact files"
          if [ "$ARTIFACT_COUNT" -gt 0 ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "::warning::No build artifacts found across all platforms — skipping release"
          fi

      - name: Generate SHA256SUMS
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/checksums
          checksum_file="artifacts/checksums/SHA256SUMS"
          temporary_file="${checksum_file}.tmp"
          : > "$temporary_file"

          while IFS= read -r -d '' artifact; do
            hash=$(sha256sum "$artifact" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$hash" "$(basename "$artifact")" \
              >> "$temporary_file"
          done < <(
            find artifacts -type f \
              ! -path 'artifacts/checksums/*' \
              -print0 | LC_ALL=C sort -z
          )

          if [ ! -s "$temporary_file" ]; then
            echo "::error::No release artifacts were available for SHA-256 generation"
            exit 1
          fi

          mv "$temporary_file" "$checksum_file"
          echo "Generated SHA256SUMS for $(wc -l < "$checksum_file" | tr -d ' ') files"
          cat "$checksum_file"

      # 生成构建状态报告
      - name: Generate build status
        id: build_status
        run: |
          STATUS=""

          if [ "${{ needs.build-android.result }}" == "success" ] && [ "${{ needs.build-android.outputs.distribution_signed }}" == "available" ]; then
            STATUS="${STATUS}✅ Android（正式签名）\n"
          elif [ "${{ needs.build-android.result }}" == "success" ]; then
            STATUS="${STATUS}✅ Android（开发签名 CI 产物；仓库未配置发布签名）\n"
          else
            STATUS="${STATUS}❌ Android (构建失败)\n"
          fi

          if [ "${{ needs.build-ios.result }}" == "success" ] && [ "${{ needs.build-ios.outputs.app_store_uploaded }}" == "true" ]; then
            STATUS="${STATUS}✅ iOS（已签名并提交 App Store Connect）\n"
          elif [ "${{ needs.build-ios.result }}" == "success" ]; then
            STATUS="${STATUS}✅ iOS（未签名编译产物；CI 未提交 App Store Connect）\n"
          else
            STATUS="${STATUS}❌ iOS (构建失败)\n"
          fi

          if [ "${{ needs.build-macos.result }}" == "success" ] && [ "${{ needs.build-macos.outputs.app_store_uploaded }}" == "true" ]; then
            STATUS="${STATUS}✅ macOS（已提交 App Store Connect，DMG 已签名公证）\n"
          elif [ "${{ needs.build-macos.result }}" == "success" ]; then
            STATUS="${STATUS}✅ macOS（未签名编译产物；CI 未提交 App Store Connect）\n"
          elif [ "${{ needs.build-macos.result }}" == "skipped" ]; then
            STATUS="${STATUS}⏭️ macOS (跳过 - 平台未配置)\n"
          else
            STATUS="${STATUS}❌ macOS (构建失败)\n"
          fi

          if [ "${{ needs.build-windows.result }}" == "success" ] && [ "${{ needs.build-windows.outputs.distribution_signed }}" == "true" ]; then
            STATUS="${STATUS}✅ Windows（Authenticode 签名）\n"
          elif [ "${{ needs.build-windows.result }}" == "success" ]; then
            STATUS="${STATUS}✅ Windows（未签名 CI 产物；仓库未配置发布证书）\n"
          elif [ "${{ needs.build-windows.result }}" == "skipped" ]; then
            STATUS="${STATUS}⏭️ Windows (跳过 - 平台未配置)\n"
          else
            STATUS="${STATUS}❌ Windows (构建失败)\n"
          fi

          if [ "${{ needs.build-linux.result }}" == "success" ]; then
            STATUS="${STATUS}✅ Linux x64\n"
          elif [ "${{ needs.build-linux.result }}" == "skipped" ]; then
            STATUS="${STATUS}⏭️ Linux x64 (跳过)\n"
          else
            STATUS="${STATUS}❌ Linux x64 (构建失败)\n"
          fi

          if [ "${{ needs.build-linux-arm64.result }}" == "success" ]; then
            STATUS="${STATUS}✅ Linux ARM64\n"
          elif [ "${{ needs.build-linux-arm64.result }}" == "skipped" ]; then
            STATUS="${STATUS}⏭️ Linux ARM64 (跳过)\n"
          else
            STATUS="${STATUS}❌ Linux ARM64 (构建失败)\n"
          fi

          echo "status<<EOF" >> $GITHUB_OUTPUT
          echo -e "$STATUS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: MyNAS v${{ needs.extract-version.outputs.full_version }}
          tag_name: ${{ needs.extract-version.outputs.tag_name }}
          draft: false
          prerelease: ${{ contains(needs.extract-version.outputs.full_version, 'beta') || contains(needs.extract-version.outputs.full_version, 'alpha') || contains(needs.extract-version.outputs.full_version, 'rc') }}
          files: |
            artifacts/**/*
          body: |
            ## MyNAS v${{ needs.extract-version.outputs.full_version }}

            ${{ steps.debug_changelog.outputs.changelog }}

            ---

            ### 🔨 构建状态

            ${{ steps.build_status.outputs.status }}

            ### 🚀 快速下载（推荐版本）

            | 平台 | 推荐版本 | 下载链接 |
            |------|----------|----------|
            | **Android** | arm64-v8a | [⬇️ MyNAS-${{ needs.extract-version.outputs.version }}-android-arm64-v8a.apk](https://github.com/${{ github.repository }}/releases/download/${{ needs.extract-version.outputs.tag_name }}/MyNAS-${{ needs.extract-version.outputs.version }}-android-arm64-v8a.apk) |
            | **iOS** | TestFlight / CI 编译产物 | App Store Connect 提交状态见上方构建状态 |
            | **macOS** | TestFlight / universal 构建 | App Store Connect 与签名状态见上方构建状态 |
            | **Windows** | x64 安装包 | [⬇️ MyNAS-${{ needs.extract-version.outputs.version }}-windows-x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.extract-version.outputs.tag_name }}/MyNAS-${{ needs.extract-version.outputs.version }}-windows-x64-setup.exe) |
            | **Linux** | x64 | [⬇️ MyNAS-${{ needs.extract-version.outputs.version }}-linux-x64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.extract-version.outputs.tag_name }}/MyNAS-${{ needs.extract-version.outputs.version }}-linux-x64.tar.gz) |
            | **Linux (ARM)** | arm64 | [⬇️ MyNAS-${{ needs.extract-version.outputs.version }}-linux-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.extract-version.outputs.tag_name }}/MyNAS-${{ needs.extract-version.outputs.version }}-linux-arm64.tar.gz) |

            ---

            ### 📦 全部下载

            <details>
            <summary>Android (点击展开)</summary>

            | 架构 | 说明 | 下载 |
            |------|------|------|
            | arm64-v8a | 64位 ARM (推荐，大多数现代手机) | [下载](https://github.com/${{ github.repository }}/releases/download/${{ needs.extract-version.outputs.tag_name }}/MyNAS-${{ needs.extract-version.outputs.version }}-android-arm64-v8a.apk) |
            | armeabi-v7a | 32位 ARM (旧设备) | [下载](https://github.com/${{ github.repository }}/releases/download/${{ needs.extract-version.outputs.tag_name }}/MyNAS-${{ needs.extract-version.outputs.version }}-android-armeabi-v7a.apk) |
            | x86_64 | 64位 x86 (模拟器/Chromebook) | [下载](https://github.com/${{ github.repository }}/releases/download/${{ needs.extract-version.outputs.tag_name }}/MyNAS-${{ needs.extract-version.outputs.version }}-android-x86_64.apk) |

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/ci.yml'
      - '.metadata'
      - 'analysis_options.yaml'
      - 'build.yaml'
      - 'l10n.yaml'
      - 'assets/**'
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'packages/**'
      - 'native/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/ci.yml'
      - '.metadata'
      - 'analysis_options.yaml'
      - 'build.yaml'
      - 'l10n.yaml'
      - 'assets/**'
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'packages/**'
      - 'native/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

  build-check:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          # 删除不需要的预装软件以释放空间
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26*
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=== After cleanup ==="
          df -h

      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android (debug)
        run: flutter build apk --debug
